[package]
name = "muster-ui"
version = "0.1.0"
description = "Muster — search everything you have ever received"
edition = "2021"
rust-version = "1.77"

[lib]
name = "muster_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
serde_json = "1"

[target."cfg(target_os = \"macos\")".dependencies]
# Not on crates.io — it has always been consumed from git. Pinned to a branch
# rather than a tag because that is what upstream publishes; `cargo update -p`
# is how it moves.
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
# Already in the tree as a Tauri dependency. Without an NSVisualEffectView
# behind it, `transparent: true` is literally see-through and the text behind
# the panel reads straight through the results.
window-vibrancy = "0.6"
# Two copies of a hotkey launcher is not a mild bug: both register the same
# shortcut, so each press toggles them in opposite phase and one is always on
# screen with no way to dismiss it. Easy to hit — rebuild while the old one is
# still resident.
tauri-plugin-single-instance = "2"

[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-global-shortcut = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
